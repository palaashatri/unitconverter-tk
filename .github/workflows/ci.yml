name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and coverage (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Tk and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test with coverage under a virtual display
        run: xvfb-run -a pytest --cov=. --cov-report=term --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint and workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run required fatal Flake8 checks
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Install pinned actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate GitHub Actions workflows
        run: actionlint .github/workflows/*.yml .github/workflows/*.yaml
