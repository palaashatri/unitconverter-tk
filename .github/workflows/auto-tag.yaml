name: Auto Tag and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-tag:
    name: Tag this main commit
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
      source_sha: ${{ steps.tag.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create or reuse this commit's version tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          existing_tag="$(git tag --points-at "$source_sha" | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -n 1 || true)"
          if [[ -n "$existing_tag" ]]; then
            tag_name="$existing_tag"
          else
            tag_name="$(python scripts/next_version.py)"
            git tag "$tag_name" "$source_sha"
            git push origin "$tag_name"
          fi
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish ${{ needs.create-tag.outputs.tag_name }}
    needs: create-tag
    uses: ./.github/workflows/cross-platform-release.yml
    with:
      tag_name: ${{ needs.create-tag.outputs.tag_name }}
      source_sha: ${{ needs.create-tag.outputs.source_sha }}
    secrets: inherit
